<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Veux-tu être mon Valentin ? 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #ffe6f0;
    }
    h1 {
      color: #ff3366;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
    }
    .oui {
      background-color: #ff6699;
      color: white;
    }
    .non {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Veux-tu être mon Valentin ? 💘</h1>
  <p>Choisis ton destin :</p>
  
  <!-- Bouton OUI -->
  <a href="mailto:tonmail@gmail.com?subject=Ma%20réponse&body=Oui%20je%20veux%20être%20ton%20Valentin">
    <button class="oui">OUI 💖</button>
  </a>
  
  <!-- Bouton NON (désactivé) -->
  <button class="non" disabled>NON ❌</button>
</body>
</html>
