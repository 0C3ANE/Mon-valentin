<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Veux-tu être mon Valentin ? 💖</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #ffe6f0;
      overflow-x: hidden;
    }
    h1 {
      color: #ff3366;
      font-size: 40px;
    }
    p {
      font-size: 20px;
      color: #333;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
    }
    .oui {
      background-color: #ff6699;
      color: white;
    }
    .non {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
    }
    .heart {
      position: fixed;
      font-size: 24px;
      animation: fall 4s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-50px); opacity:1; }
      100% { transform: translateY(100vh); opacity:0; }
    }
    #message-secret {
      font-size: 24px;
      color: #ff3366;
      margin-top: 30px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Veux-tu être mon Valentin ? 💘</h1>
  <p>Choisis ton destin :</p>
  
  <!-- Bouton OUI -->
  <a id="oui-lien" href="mailto:tonmail@gmail.com?subject=Ma%20réponse&body=Oui%20je%20veux%20être%20ton%20Valentin">
    <button class="oui">OUI 💖</button>
  </a>
  
  <!-- Bouton NON (désactivé) -->
  <button class="non" disabled>NON ❌</button>
  
  <!-- Message secret après clic -->
  <div id="message-secret">Youpi ! 💕 Merci d'être mon Valentin ! 😍</div>

  <script>
    // Afficher le message secret quand OUI est cliqué
    document.getElementById('oui-lien').addEventListener('click', function() {
      document.getElementById('message-secret').style.display = 'block';
    });

    // Créer des cœurs qui tombent
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.fontSize = (20 + Math.random()*30) + 'px';
      heart.innerHTML = '❤️';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
